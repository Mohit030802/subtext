name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend — Build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Dummy values so Next.js build doesn't fail on missing env vars
          NEXT_PUBLIC_API_URL: http://localhost:8000
          AUTH_SECRET: ci-dummy-secret-32-characters-long
          AUTH_GOOGLE_ID: dummy
          AUTH_GOOGLE_SECRET: dummy
          NEXTAUTH_URL: http://localhost:3000

  backend-ci:
    name: Backend — Import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — import app
        run: python -c "from app.main import app; print('✅ App imported successfully')"
        env:
          DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
          SYNC_DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          AUTH_SECRET: ci-dummy-secret
          GOOGLE_API_KEY: dummy
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
